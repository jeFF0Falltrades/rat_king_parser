name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  unit-tests:
    name: Run unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install ".[dev]"

      - name: Run unit test suite
        run: pytest tests/test_framework.py -v

  malware-sample-tests:
    name: Run malware sample tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    # The job will run if:
    # 1. It's a push to master (e.g., a merge)
    # 2. It's a PR from the same repository (internal)
    if: >
      github.event_name == 'push' || 
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y p7zip-full
          pip install ".[dev]"
        
      - name: Decrypt malware samples
        run: |
          7z x tests/samples.enc.zip -p'${{ secrets.SAMPLES_ZIP_PASSWORD }}' -otests/samples/
          ls -la tests/samples/

      - name: Run malware pytest suite
        run: pytest tests/ --maxfail=1 --disable-warnings -q
     
      - name: Clean up samples
        run: rm -rf tests/samples
